# First analysis in the upstream starmap_analysis.ipynb (cells 2–13).
# The preparation script selects cells with a non-null cluster_name.
[data]
input = "data/starmap_reference/starmap_annotated.h5ad"
output = "results/starmap_reference/workflow"
sample_name = "starmap_BY3_1k"
spatial_key = "spatial"

[parameters]
lambdas = [0.8]
resolutions = [0.8]
pca_dims = [20]
num_neighbours = 15
num_nn = 50
max_m = 1
seed = 1234
add_umap = false
scatter_size = 12.0
