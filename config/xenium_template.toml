[data]
input = "/path/to/xenium_prepared.h5ad"
output = "/path/to/banksy_output/xenium"
sample_column = "sample_id"
spatial_key = "spatial"
# Omit `samples` to process every sample found in sample_column.
samples = ["sample_01"]

[parameters]
lambdas = [1.0]
resolutions = [0.1, 0.2, 0.3]
pca_dims = [20]
num_neighbours = 15
num_nn = 50
max_m = 1
seed = 1234
add_umap = false
scatter_size = 4.0
