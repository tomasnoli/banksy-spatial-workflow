[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "banksy-spatial-workflow"
version = "0.1.0"
description = "Reproducible BANKSY domain analysis for Xenium and Visium data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
authors = [
  { name = "Tomas Noli" },
]
keywords = ["spatial transcriptomics", "BANKSY", "Xenium", "Visium"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "pybanksy==1.3.4",
]

[project.urls]
Repository = "https://github.com/tomasnoli/banksy-spatial-workflow"
Issues = "https://github.com/tomasnoli/banksy-spatial-workflow/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.16,<0.17",
]

[project.scripts]
banksy-workflow = "banksy_workflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/banksy_workflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
